name: "CI"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - LICENCE
      - "*.md"
      - "renovate.json"
      - .git*
      - .editorconfig
      - "*.nix"
      - flake.lock
      - docker-compose.yml

env:
  REGISTRY: git.nadeko.net

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: https://code.forgejo.org/actions/checkout@v7

      - name: Setup Docker BuildX system
        uses: https://code.forgejo.org/docker/setup-buildx-action@v3

      - name: Login to Docker Container Registry
        uses: https://code.forgejo.org/docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Docker meta
        id: meta
        uses: https://code.forgejo.org/docker/metadata-action@v6
        with:
          images: git.nadeko.net/fijxu/ytproxy-go
          tags: |
            type=sha,format=short,prefix={{date 'YYYY.MM.DD'}}-,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Build and push Docker
        uses: https://code.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

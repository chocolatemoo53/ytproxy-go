# All settings are also available with environment variables!
# They are all prefixed by `YTPROXY_`
# Example:
#   - `YTPROXY_SERVER_ENABLE_HTTP=false`
#   - `YTPROXY_SERVER_UDS=false`
#   - `YTPROXY_COMPANION_SECRET_KEY=false`

# Server settings
server:
  # HTTP server
  enable_http: true
  # Unix sockets server
  uds: true
  # Path of the unix socket
  uds_path: /tmp/ytproxy-go.sock
  # Listening address for the HTTP server
  host: 0.0.0.0
  # Listening port for the HTTP server
  port: 8080

# Proxy to use for requests for Youtube
#
# The companion puts the YouTube video id in `ytid`. It is sent to the proxy as
# the login (the username), so a proxy that rotates its source addresses
# (proxy-ipv6-rotation.py) keeps all requests for a video on one address, the
# one the video's URLs were issued to.
#
# HTTP/1.1 and HTTP/2: http://, https:// or socks5:// URLs.
# HTTP/3 needs SOCKS5 with UDP ASSOCIATE: socks5h://host:port (the h leaves the
# resolving of googlevideo's name to the proxy, needed for a proxy that only
# has IPv6 source addresses). Any other scheme is ignored and QUIC leaves
# directly. proxy-ipv6-rotation.py serves SOCKS5 when PROXY_SOCKS5_PORT is set.
proxy: ""
# The HTTP client version to use for requests to Youtube
# 1: HTTP/1.1
# 2: HTTP/2
# 3: HTTP/3
http_client_version: 1
# Only use IPV6 for requests to Youtube
ipv6_only: false
log_level: info

companion:
  # 16 characters secret key from Invidious Companion
  secret_key: ""
